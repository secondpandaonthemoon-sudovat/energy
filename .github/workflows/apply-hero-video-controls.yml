name: Apply Hero Video Controls

on:
  push:
    branches:
      - supabase-live-preview
    paths:
      - '.github/workflows/apply-hero-video-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-live-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/patch-hero-video-controls.mjs
      - name: Build
        run: |
          npm install --silent
          npm run build
          node --check js/AdminUnifiedPanels.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/AdminUnifiedPanels.js assets/app.js assets/app.js.LEGAL.txt assets/tailwind.css
          git commit -m 'Separate Hero video hide and delete controls'
          git push origin HEAD:supabase-live-preview
