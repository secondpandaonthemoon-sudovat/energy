name: Final Hero Video Controls

on:
  push:
    branches: [supabase-live-preview]
    paths:
      - '.github/workflows/final-hero-video-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-live-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Hero video controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/AdminUnifiedPanels.js')
          s=p.read_text()
          old=""" const remove=i=>{if(confirm('Bu video kartı silinsin mi?'))setVideos(videos.filter((_,x)=>x!==i))};
 const move=(i,d)=>{const j=i+d;if(j<0||j>=videos.length)return;const n=[...videos];[n[i],n[j]]=[n[j],n[i]];setVideos(n)};"""
          new=""" const remove=i=>{if(confirm('Bu video kartı CMS listesinden tamamen silinsin mi?'))setVideos(videos.filter((_,x)=>x!==i))};
 const detach=i=>patch(i,{visible:false});
 const restore=i=>patch(i,{visible:true});
 const move=(i,d)=>{const j=i+d;if(j<0||j>=videos.length)return;const n=[...videos];[n[i],n[j]]=[n[j],n[i]];setVideos(n)};"""
          assert old in s, 'remove/move block not found'
          s=s.replace(old,new,1)
          old2="""actions:h('div',{className:'flex flex-wrap gap-2'},BTN('↑',()=>move(i,-1)),BTN('↓',()=>move(i,1)),BTN('Çıkart',()=>remove(i),'text-red-600'))"""
          new2="""actions:h('div',{className:'flex flex-wrap gap-2'},BTN('↑',()=>move(i,-1)),BTN('↓',()=>move(i,1)),v.visible===false?BTN('Hero’ya Ekle',()=>restore(i),'bg-emerald-50 text-emerald-700'):BTN('Hero’dan Çıkart',()=>detach(i),'bg-amber-50 text-amber-700'),BTN('Sil',()=>remove(i),'text-red-600'))"""
          assert old2 in s, 'actions block not found'
          s=s.replace(old2,new2,1)
          old3="""'Video kartları index sayfasında sol altta üst üste sıralanır. Her kartın kendi “Göster” kutucuğu vardır. İşaretli olmayan kart frontend’de hiç render edilmez.'"""
          new3="""'Video kartları index sayfasında sol altta üst üste sıralanır. “Hero’dan Çıkart” kartı gizler ama ayarlarını korur; “Sil” kartı CMS listesinden tamamen kaldırır. Her kartın kendi “Göster” kutucuğu vardır.'"""
          assert old3 in s, 'help text not found'
          s=s.replace(old3,new3,1)
          p.write_text(s.rstrip()+"\n")
          PY
      - name: Build and validate
        run: |
          npm install --silent
          npm run build
          node --check js/AdminUnifiedPanels.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/AdminUnifiedPanels.js assets/app.js assets/app.js.LEGAL.txt assets/tailwind.css
          git commit -m 'Separate Hero video detach and delete actions'
          git push origin HEAD:supabase-live-preview
