name: Final TurkTicaret Package

on:
  push:
    branches: [supabase-live-preview]
    paths:
      - '.github/workflows/final-turkticaret-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-live-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          npm install --silent
          npm run build
          node --check js/AdminUnifiedPanels.js
          node --check js/components/Hero.js
          node --check js/App.js
          node --check js/components/VideoReelModal.js
      - name: Prepare installation package
        run: |
          mkdir -p dist-package
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='dist-package' ./ dist-package/
          cd dist-package
          zip -qr ../ASAY_Energy_Turkticaret_FINAL_2026-10-13.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ASAY_Energy_Turkticaret_FINAL_2026-10-13
          path: ASAY_Energy_Turkticaret_FINAL_2026-10-13.zip
          if-no-files-found: error
